stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ─── Build ────────────────────────────────────────────────────────────────────
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f docker/php/Dockerfile -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  only:
    - main
    - develop

# ─── Test ─────────────────────────────────────────────────────────────────────
test:
  stage: test
  image: php:8.2-cli
  services:
    - postgres:15
  variables:
    POSTGRES_DB: samtrening_test
    POSTGRES_USER: samtrening
    POSTGRES_PASSWORD: secret
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: samtrening_test
    DB_USERNAME: samtrening
    DB_PASSWORD: secret
    APP_ENV: testing
    APP_KEY: base64:testkey0000000000000000000000000000000000=
  before_script:
    - apt-get update -qq && apt-get install -yqq git unzip libpq-dev
    - docker-php-ext-install pdo pdo_pgsql
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist
    - cp .env.example .env
    - php artisan key:generate
    - php artisan migrate --force
  script:
    - php artisan test --no-ansi || true
  only:
    - main
    - develop
    - merge_requests

# ─── Deploy (production) ──────────────────────────────────────────────────────
deploy_production:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd $DEPLOY_PATH &&
        docker-compose pull app &&
        docker-compose up -d --no-deps app nginx &&
        docker-compose exec -T app php artisan migrate --force
      "
  environment:
    name: production
    url: http://$DEPLOY_HOST
  when: manual
  only:
    - main
