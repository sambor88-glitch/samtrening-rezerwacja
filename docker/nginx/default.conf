server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 50M;

    # Named routes: /login /trainer /client /admin → HTML files
    location = /login   { try_files /login.html =404; }
    location = /trainer { try_files /trainer.html =404; }
    location = /client  { try_files /client.html =404; }
    location = /admin   { try_files /admin.html =404; }

    # API → zawsze przez PHP, nigdy statyczne pliki
    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    # Static frontend files (HTML/JS) – serve directly
    location ~* \.(js|json|svg|png|ico|css|woff2?)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Wszystko inne → Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=50M \n post_max_size=50M";
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
