version: '3.9'

services:
  # ── PHP-FPM (Laravel) ───────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: samtrening_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - samtrening

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: samtrening_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - samtrening

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: samtrening_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-samtrening}
      POSTGRES_USER: ${DB_USERNAME:-samtrening}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - samtrening_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-samtrening}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - samtrening

volumes:
  samtrening_db:

networks:
  samtrening:
    driver: bridge
